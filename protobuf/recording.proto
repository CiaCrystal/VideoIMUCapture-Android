syntax = "proto3";

import "google/protobuf/timestamp.proto";

package videoimu;

option java_package = "se.lth.math.videoimucapture";
option java_outer_classname = "RecordingProtos";

message CameraInfo {
  //fx, fy, cx, cy, s
  // See https://developer.android.com/reference/android/hardware/camera2/CameraCharacteristics#LENS_INTRINSIC_CALIBRATION
  // for details on how to use the intrinsics, pose_translation and pose_rotation.
  repeated float intrinsic_params = 1;
  //Radial: k1,k2,k3, Tangential: k4,k5
  repeated float distortion_params = 2;
  bool optical_image_stabilization = 3;
  bool video_stabilization = 4;
  bool distortion_correction = 10;
  int32 sensor_orientation = 14;

  enum FocusCalibration {
    UNCALIBRATED = 0;
    APPROXIMATE = 1;
    CALIBRATED = 2;
  }
  FocusCalibration focus_calibration = 5;

  enum TimestampSource {
    UNKNOWN = 0;
    REALTIME = 1;
  }
  TimestampSource timestamp_source = 6;

  enum LensPoseReference {
    PRIMARY_CAMERA = 0;
    GYROSCOPE = 1;
    UNDEFINED = 2;
  }
  LensPoseReference lens_pose_reference = 7;
  repeated float lens_pose_rotation = 8;
  repeated float lens_pose_translation = 9;

  message Size {
    int32 width = 1;
    int32 height = 2;
  }
  Size resolution = 11;
  Size pre_correction_active_array_size = 12; //SENSOR_INFO_PRE_CORRECTION_ACTIVE_ARRAY_SIZE
  repeated float original_intrinsic_params = 13;
  string camera_id = 15;
  repeated int32 available_ois_modes = 16;
  repeated int32 available_ois_data_modes = 17;
  repeated int32 available_af_modes = 18;
  float minimum_focus_distance_diopters = 19;
  float hyperfocal_distance_diopters = 20;
  int32 focus_distance_calibration = 21;
  bool minimum_focus_distance_available = 22;
  bool hyperfocal_distance_available = 23;
  bool focus_distance_calibration_available = 24;
  bool supports_af_state = 25;
  bool supports_lens_state = 26;
  bool supports_focus_range = 27;
  bool supports_af_scene_change = 28;
  bool supports_lens_intrinsic_calibration = 29;
  bool supports_lens_intrinsics_samples = 30;
  bool supports_ois_data = 31;
  bool supports_ois_samples = 32;
  bool available_ois_data_modes_key_available = 33;
  string device_manufacturer = 34;
  string device_model = 35;
  string android_version = 36;
  int32 android_api_level = 37;
  int32 camera_hardware_level = 38;
  bool camera_hardware_level_available = 39;
}

message CaptureConfig {
  int32 config_id = 1;
  int32 requested_af_mode = 2;
  float requested_focus_distance_diopters = 3;
  bool requested_focus_distance_available = 4;
  int32 requested_optical_stabilization_mode = 5;
  int32 requested_ois_data_mode = 6;
  int32 requested_video_stabilization_mode = 7;
  int32 requested_ae_mode = 8;
  int32 requested_awb_mode = 9;
  repeated int32 requested_fps_range = 10; // [min, max]
  int32 capture_template = 11;
  int32 requested_af_trigger = 12;
}

message ExperimentInfo {
  string experiment_id = 1;
  string trial_group = 2;
  string device_pose = 3;
  string support_condition = 4;
  string af_experiment_mode = 5;
  string ois_experiment_mode = 6;
  bool camera_covered = 7;
  bool camera_covered_available = 8;
  string scene_type = 9;
  string target_type = 10;
  string notes = 11;
}

message TouchEvent {
  int64 time_ns = 1;
  int32 action = 2;
  float x_px = 3;
  float y_px = 4;
  float pressure = 5;
  float size = 6;
  int32 pointer_id = 7;
  string target_label = 8;
  int64 trial_id = 9;
}

message VideoFrameToTimestamp{
  int64 time_us = 1;
  int64 frame_nbr = 2;
}

message VideoFrameMetaData {
  int64 time_ns = 1;
  int64 frame_number = 2;
  int64 exposure_time_ns = 3;
  int64 frame_duration_ns = 4;
  int64 frame_readout_ns = 5;
  int32 iso = 6;
  float focal_length_mm = 7;
  float est_focal_length_pix = 8;
  float focus_distance_diopters = 9;

  message OISSample {
    int64 time_ns = 1;
    float x_shift = 2;
    float y_shift = 3;
    string target_label = 4;
    int64 trial_id = 5;
  }
  repeated OISSample OIS_samples =10;
  bool focus_locked = 11;
  // Actual CaptureResult values: -1 = not reported, 0 = off, 1 = on.
  int32 optical_stabilization_mode = 12;
  int32 video_stabilization_mode = 13;
  int32 ois_data_mode = 14;
  // Kept separate because frame_number is replaced by the encoded-video index after matching.
  int64 camera_frame_number = 15;
  int32 af_mode = 16;
  int32 af_state = 17;
  int32 lens_state = 18;
  repeated float focus_range_diopters = 19; // [near, far]
  int32 af_scene_change = 20;

  message AFRegion {
    int32 left = 1;
    int32 top = 2;
    int32 right = 3;
    int32 bottom = 4;
    int32 weight = 5;
  }
  repeated AFRegion af_regions = 21;
  repeated float lens_intrinsic_calibration = 22; // fx, fy, cx, cy, skew

  message LensIntrinsicsSample {
    int64 time_ns = 1;
    repeated float intrinsics = 2; // fx, fy, cx, cy, skew
  }
  repeated LensIntrinsicsSample lens_intrinsics_samples = 23;
  float aperture = 24;
  bool camera_frame_number_available = 25;
}

message IMUInfo {
  string gyro_info = 1;
  float gyro_resolution = 2;
  string accel_info = 3;
  float accel_resolution = 4;
  float sample_frequency = 5; //Hz
  repeated float placement = 6;

  // added for magnetometer support
  string mag_info = 7;
  float mag_resolution = 8;

  // User-selected rates are requests; device/OS limits can produce lower actual rates.
  float requested_accelerometer_frequency_hz = 9;
  float requested_gyroscope_frequency_hz = 10;
  float estimated_gyroscope_frequency_hz = 11;
}

message IMUData {
  int64 time_ns = 1;
  repeated float gyro = 2;
  repeated float gyro_drift = 3;
  repeated float accel = 4;
  repeated float accel_bias = 5;
  enum Accuracy {
    UNRELIABLE=0;
    LOW = 1;
    MEDIUM = 2;
    HIGH = 3;
  }
  Accuracy gyro_accuracy = 6;
  Accuracy accel_accuracy = 7;

  // added for magnetometer support
  repeated float mag = 8;
  repeated float mag_bias = 9;
  Accuracy mag_accuracy = 10;
}

message VideoCaptureData {
  google.protobuf.Timestamp time = 1;
  CameraInfo camera_meta = 2;
  IMUInfo imu_meta = 3;

  repeated IMUData imu = 4;
  repeated VideoFrameMetaData video_meta = 5;
  repeated CaptureConfig capture_config = 6;
  repeated ExperimentInfo experiment_info = 7;
  repeated TouchEvent touch_event = 8;
}

message MessageWrapper {
  oneof msg {
    CameraInfo camera_meta = 1;
    IMUData imu_data = 2;
    IMUInfo imu_meta = 3;
    VideoFrameMetaData frame_meta = 4;
    VideoFrameToTimestamp frame_time = 5;
    CaptureConfig capture_config = 6;
    ExperimentInfo experiment_info = 7;
    TouchEvent touch_event = 8;
  }
}
